aid: red6
name: Red 6
description: 'Red 6 (Red Six Aerospace, Inc.) is a defense technology company founded
  in 2018 that builds outdoor, high-speed augmented reality for military aviation
  training. Its flagship product, ATARS (Advanced Tactical Augmented Reality System),
  pairs the EVE (Enhanced Visual Environment) helmet-mounted display — 160-degree
  field of view, 18,000 nits, 10ms latency, full color — with an AI-driven multiplayer
  network so real pilots in real aircraft can fly and maneuver against synthetically
  generated adversaries in real time, in daylight. A companion system, ARCADE (Augmented
  Reality Command and Analytic Data Environment), handles mission planning, briefing
  and three-dimensional debrief. ATARS has been integrated or trialed on the USAF
  F-16 and MC-130, the RAF Hawk T-2, Boeing''s AH-64E Apache CATT, and the Lockheed
  Martin / Korea Aerospace Industries T-50/TF-50. Red 6 is ISO 9001:2015 and AS9100D
  certified. It publishes no public developer program, API, SDK or machine-readable
  contract — its software surface is delivered through defense programs and OEM integrations
  rather than a self-serve developer platform.'
